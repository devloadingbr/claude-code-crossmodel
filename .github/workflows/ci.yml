name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: node --test test/*.test.mjs
      - name: Syntax
        run: for f in $(git ls-files "*.mjs"); do node --check "$f"; done
